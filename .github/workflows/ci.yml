name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Version matches swagger
        # Версия пакета == info.version из openapi.json == avito_ads.API_VERSION == __version__.
        run: |
          python - <<'EOF'
          import json
          import sys
          from importlib.metadata import version

          import avito_ads

          versions = {
              "package metadata": version("avito-ads"),
              "avito_ads.__version__": avito_ads.__version__,
              "avito_ads.API_VERSION": avito_ads.API_VERSION,
              "openapi.json info.version": json.load(open("openapi.json", encoding="utf-8"))["info"]["version"],
          }
          for name, value in versions.items():
              print(f"{name}: {value}")
          if len(set(versions.values())) != 1:
              sys.exit("Версии расходятся")
          EOF
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Mypy
        run: mypy avito_ads
