[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avito-ads"
version = "0.1.0"
description = "Python SDK для публичного API кабинета Авито Реклама (Avito Ads). Синхронный и асинхронный режимы (httpx), Python 3.8+, интеграции с Django, Flask и FastAPI."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["avito", "avito-ads", "реклама", "api", "client", "sdk", "async", "httpx"]
authors = [{ name = "asbezrukov", email = "asbezrukov@avito.ru" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.24,<1.0"]

[project.urls]
Homepage = "https://github.com/avito-tech/avito-ads-sdk-python3"
Repository = "https://github.com/avito-tech/avito-ads-sdk-python3"
Changelog = "https://github.com/avito-tech/avito-ads-sdk-python3/blob/main/CHANGELOG.md"
Issues = "https://github.com/avito-tech/avito-ads-sdk-python3/issues"

[project.optional-dependencies]
django = ["django>=3.2"]
flask = ["flask>=2.0"]
fastapi = ["fastapi>=0.95"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.1",
    "mypy>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["avito_ads*"]

[tool.setuptools.package-data]
avito_ads = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
# Сохраняем совместимость с Python 3.8: не навязываем синтаксис 3.9+/3.10+
# (list[...] вместо List[...], X | None вместо Optional[...], удаление кавычек у forward-ref).
ignore = ["UP006", "UP007", "UP035", "UP037", "UP045"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: интеграционные тесты против реальной песочницы (по умолчанию пропускаются)",
]
